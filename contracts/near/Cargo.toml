[package]
name = "kipulux_near_contract"
version = "0.1.0"
edition = "2021"
authors = ["Daniel <web3@kipulux.com>"]
description = "Smart Contract NEAR Protocol para Trazabilidad Inmutable y Pasaporte Digital de Lujo Kipulux"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.2.1", features = ["legacy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
