services:
  neo4j:
    image: neo4j:5-community
    container_name: kipu-neo4j
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1024m
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./docker/neo4j/data:/data
      - ./docker/neo4j/logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - kipu-net

  backend:
    build: .
    container_name: kipu-backend
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - JWT_SECRET=${JWT_SECRET:-secret}
      - VAULT_PRIVATE_KEY=${VAULT_PRIVATE_KEY}
      - RPC_URL=${RPC_URL:-https://rpc-zk.tanenbaum.io/}
      - CHAIN_ID=${CHAIN_ID:-57057}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - SIMPLEFACT_API_URL=${SIMPLEFACT_API_URL:-https://api.simplefact.pe/v1}
      - SIMPLEFACT_TOKEN_BEARER=${SIMPLEFACT_TOKEN_BEARER:-mock}
      - SIMPLEFACT_RUC_EMISOR=${SIMPLEFACT_RUC_EMISOR:-20600123456}
      - NEAR_NETWORK_ID=${NEAR_NETWORK_ID:-testnet}
      - NEAR_NODE_URL=${NEAR_NODE_URL:-https://rpc.testnet.near.org}
      - NEAR_CONTRACT_NAME=${NEAR_CONTRACT_NAME:-kipulux-8046af.testnet}
      - NEAR_RELAYER_ACCOUNT_ID=${NEAR_RELAYER_ACCOUNT_ID:-kipu-relayer-8046af.testnet}
      - NEAR_RELAYER_PRIVATE_KEY=${NEAR_RELAYER_PRIVATE_KEY:-ed25519:your_near_relayer_private_key_here}
      - NEAR_MOCK_FALLBACK=${NEAR_MOCK_FALLBACK:-false}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./docker/uploads:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kipu-net

networks:
  kipu-net:
    driver: bridge
